name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Match make install's workspace cache instead of caching an unused home directory.
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      npm_config_cache: ${{ github.workspace }}/.cache/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make install
      - run: .venv/bin/python scripts/check-api.py
        timeout-minutes: 7
      - run: .venv/bin/python -m pip check
      - run: make check
      - run: make build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm --prefix apps/web run test:e2e -- --workers=2
      - run: npm --prefix apps/web run test:e2e -- --workers=2
        env:
          E2E_PROVIDER_MODE: simulation
      - run: npm --prefix apps/web run test:e2e -- --workers=2
        env:
          E2E_PROVIDER_MODE: bidcars
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: apps/web/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-backend-results
          path: .cache/qa/backend-results.xml
          if-no-files-found: ignore
          retention-days: 7

  windows-resolver:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      npm_config_cache: ${{ github.workspace }}/.cache/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate PowerShell launcher syntax
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Set up through the documented Windows entry point
        shell: powershell
        run: .\scripts\setup.ps1 -PythonCommand python -InstallBrowser
      - run: .\.venv\Scripts\python.exe scripts/check-api.py
        timeout-minutes: 7
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
      - run: npm --prefix apps/web run test:e2e -- --workers=2
      - run: npm --prefix apps/web run test:e2e -- --workers=2
        env:
          E2E_PROVIDER_MODE: simulation
      - run: npm --prefix apps/web run test:e2e -- --workers=2
        env:
          E2E_PROVIDER_MODE: bidcars
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-browser-failure-evidence
          path: apps/web/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-backend-results
          path: .cache/qa/backend-results.xml
          if-no-files-found: ignore
          retention-days: 7
