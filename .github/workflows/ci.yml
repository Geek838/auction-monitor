name: Resolver checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make install
      - run: make test-api
      - run: make check
      - run: make build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make test-web
      - run: make test-web
        env:
          E2E_PROVIDER_MODE: simulation
      - run: make test-web
        env:
          E2E_PROVIDER_MODE: bidcars
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: apps/web/test-results/
          retention-days: 7

  windows-resolver:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r services/api/requirements.txt
      - run: npm --prefix apps/web ci
      - run: .\.venv\Scripts\python.exe -m pytest services/api/tests
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: npm --prefix apps/web run test:e2e -- --workers=2
      - run: npm --prefix apps/web run test:e2e -- --workers=2
        env:
          E2E_PROVIDER_MODE: simulation
      - run: npm --prefix apps/web run test:e2e -- --workers=2
        env:
          E2E_PROVIDER_MODE: bidcars
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-browser-failure-evidence
          path: apps/web/test-results/
          retention-days: 7
